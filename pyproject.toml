[project]
name = "shortjob-runtime-admission"
version = "0.1.0"
description = "Public artifact for worker-local runtime optimization admission experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "nvidia-ml-py>=13.580.65",
    "numpy>=2.4.4",
    "seaborn>=0.13.2",
    "shortjob-runner",
    "torch==2.12.0+cu126; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.12.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
real-models = ["shortjob-runner[real-models]"]

[tool.uv]
package = false

[tool.uv.sources]
shortjob-runner = { workspace = true }
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.workspace]
members = [
    "src",
]
